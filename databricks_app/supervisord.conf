[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

# ── Original app (port 8501 → nginx /) ───────────────────────────────────────
[program:streamlit]
command=streamlit run /app/app.py
    --server.port=8501
    --server.address=127.0.0.1
    --server.headless=true
    --server.enableCORS=false
    --server.enableXsrfProtection=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

# ── Wesco-branded app (port 8502 → nginx /wesco) ─────────────────────────────
# baseUrlPath tells Streamlit it is mounted at /wesco so all asset/WS URLs are correct
[program:streamlit_wesco]
command=streamlit run /app/app_wesco.py
    --server.port=8502
    --server.address=127.0.0.1
    --server.headless=true
    --server.enableCORS=false
    --server.enableXsrfProtection=false
    --server.baseUrlPath=/wesco
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

# ── nginx reverse proxy ───────────────────────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
