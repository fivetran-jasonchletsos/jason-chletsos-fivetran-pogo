version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 249080915751.dkr.ecr.us-east-1.amazonaws.com
  build:
    commands:
      - cd streamlit_app
      - docker build --platform linux/amd64 -t pokemon-go-analytics:latest .
      - docker tag pokemon-go-analytics:latest 249080915751.dkr.ecr.us-east-1.amazonaws.com/pokemon-go-analytics:latest
  post_build:
    commands:
      - docker push 249080915751.dkr.ecr.us-east-1.amazonaws.com/pokemon-go-analytics:latest
      - aws ecs update-service --cluster pokemon-cluster --service pokemon-streamlit --force-new-deployment --region us-east-1
      - echo "Deployment triggered"
